<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com Seções</title>
    <style>
        body {
            margin: 0; 
            font-family: Arial, sans-serif; 
        }
        header {
            background-color: #4CAF50; 
            padding: 20px;
            position: relative; 
            color: white; 
        }
        .header-text {
            position: absolute; 
            top: 10px; 
            right: 20px; 
            font-size: 18px; 
            color: white; 
        }
        main {
            background-color: black; 
            color: white; 
            padding: 20px;
            min-height: 400px; 
            text-align: center; 
        }
        footer {
            background-color: gold; 
            padding: 10px;
            text-align: center; 
        }
        .heartbeat {
            display: inline-block;
            animation: heartbeat 1.5s infinite paused; 
        }
        @keyframes heartbeat {
            0%, 20% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1); 
            }
            100% {
                transform: scale(1); 
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem-vindo à Minha Página sobre Vida Saudável e Próspera</h1>
        <div class="header-text">be-healthy.ai</div> 
    </header>

    <main>
        <h2>Conteúdo Principal</h2>
        <p>Este é o corpo da página onde você pode adicionar seu conteúdo.</p>

        <div class="heartbeat" id="heartContainer">
            <img src="https://images.hindustantimes.com/img/2022/01/27/550x309/healthy-gdae63cff2_1280_1643268445755_1643268464696.png" alt="Coração ECG" width="200" height="200"/> <!-- Substitua o URL acima -->
        </div>

        <button id="myButton">Clique Aqui</button>
    </main>

    <footer>
        <p>© 2025 Minha Página Web</p>
    </footer>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkit.SpeechRecognition)();
        recognition.interimResults = true; 

        const heartContainer = document.getElementById('heartContainer');

        function startRecognition() {
            recognition.start();
        }

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            console.log(transcript); // Para depuração

            if (transcript.includes('pulsar')) {
                heartContainer.style.animationPlayState = 'running'; 
            } else if (transcript.includes('parar')) {
                heartContainer.style.animationPlayState = 'paused'; 
            }
        };

        recognition.onerror = (event) => {
            console.error('Erro de reconhecimento: ', event.error); // Log de erros
        };

        recognition.onend = () => {
            startRecognition(); 
        };

        startRecognition(); 
    </script>

</body>
</html>
